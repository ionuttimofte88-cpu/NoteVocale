name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          unzip -q -o NoteVocale.zip -d src
          cd src/NoteVocale
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/NoteVocale.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Note Vocale AI
          files: NoteVocale.apk
